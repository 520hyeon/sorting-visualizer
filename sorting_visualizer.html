:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #18202c; --ink2: #3d4757; --mute: #7d8798; --line: #e2e6ec; --soft: #f5f6f8;
  --bar: #c6cedb; --bar-out: #c6cedb; --cmp: #f2b13a; --wr: #e8505b; --eq: #f3d679; --hi: #d7dce5;
  --p1: #3457d5; --p1s: #e6ecff; --p2: #0b8a72; --p2s: #dcf2ec; --p3: #b8730f; --p3s: #f8ecd6; --p4: #b7327c; --p4s: #f9e3ef;
  --acc: var(--p1); --accs: var(--p1s);
  --code-bg: #f8f7f3; --code-hl: #fff1cc; --code-hl-bar: #e0a52a; --pn: #6b4e16; --as: #b8730f; --cm: #9a9f8f;
  --shadow: 0 1px 2px rgba(20, 30, 50, .05), 0 4px 16px rgba(20, 30, 50, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #171b23; --ink: #e8ecf2; --ink2: #c3cad6; --mute: #8590a2; --line: #2a303c; --soft: #1e232d;
    --bar: #4a5366; --bar-out: #4a5366; --cmp: #e7a52e; --wr: #f06470; --eq: #b89a35; --hi: #3a4252;
    --p1: #7b97ff; --p1s: #253158; --p2: #3cc6a7; --p2s: #183c35; --p3: #e3a24a; --p3s: #3d2f17; --p4: #ea6aae; --p4s: #44203a;
    --code-bg: #1b1f27; --code-hl: #3a3218; --code-hl-bar: #e0a52a; --pn: #e6c27a; --as: #e3a24a; --cm: #7d8590;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --card: #171b23; --ink: #e8ecf2; --ink2: #c3cad6; --mute: #8590a2; --line: #2a303c; --soft: #1e232d;
  --bar: #4a5366; --bar-out: #4a5366; --cmp: #e7a52e; --wr: #f06470; --eq: #b89a35; --hi: #3a4252;
  --p1: #7b97ff; --p1s: #253158; --p2: #3cc6a7; --p2s: #183c35; --p3: #e3a24a; --p3s: #3d2f17; --p4: #ea6aae; --p4s: #44203a;
  --code-bg: #1b1f27; --code-hl: #3a3218; --code-hl-bar: #e0a52a; --pn: #e6c27a; --as: #e3a24a; --cm: #7d8590;
  --shadow: none;
}
body[data-part="1"] { --acc: var(--p1); --accs: var(--p1s); }
body[data-part="2"] { --acc: var(--p2); --accs: var(--p2s); }
body[data-part="3"] { --acc: var(--p3); --accs: var(--p3s); }
body[data-part="4"] { --acc: var(--p4); --accs: var(--p4s); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink);
       background: var(--bg); font-size: 15px; line-height: 1.55; word-break: keep-all; padding-bottom: 96px; }
.mono, code, input.mono { font-family: 'D2Coding', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

/* header */
.top { padding: 22px 0 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.top h1 span { color: var(--acc); }
.top p { color: var(--mute); font-size: 13.5px; margin-top: 2px; }
.theme-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink2); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* controls */
.controls { padding: 16px 18px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.lab { font-size: 12.5px; font-weight: 700; color: var(--mute); min-width: 56px; }
select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 11px; outline: none; }
select:focus, input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--accs); }
select#algo { font-weight: 700; min-width: 260px; }
input#input { flex: 1; min-width: 220px; font-size: 15px; }
input#count { width: 70px; }
.opt input { width: 74px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 9px; padding: 8px 13px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--acc); color: var(--acc); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.chip.acc { background: var(--accs); color: var(--acc); }
.chip.out { background: transparent; border: 1.4px solid var(--p4); color: var(--p4); font-weight: 700; }
.chip.no { color: var(--mute); text-decoration: line-through; text-decoration-color: rgba(125, 135, 152, .5); }
.chip b { font-weight: 800; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
.opt small { color: var(--mute); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); cursor: pointer; user-select: none; }
.check input { accent-color: var(--acc); width: 16px; height: 16px; }
.msg { font-size: 13.5px; border-radius: 9px; padding: 9px 12px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; }
.msg.show { display: flex; }
.msg.err { background: #fde8ea; color: #a8202d; }
.msg.info { background: var(--accs); color: var(--ink2); }
:root[data-theme="dark"] .msg.err { background: #4a1d24; color: #ffb4bc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg.err { background: #4a1d24; color: #ffb4bc; } }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; margin-top: 14px; align-items: start; }
.viz { padding: 16px 18px 14px; min-width: 0; }
.status { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
  background: var(--soft); font-size: 15px; font-weight: 600; }
.status .stepno { font-family: 'D2Coding', monospace; font-size: 12px; color: var(--mute); font-weight: 400; white-space: nowrap; }
.status .d { flex: 1; }
.keybox { font-family: 'D2Coding', monospace; font-size: 13px; font-weight: 700; background: var(--cmp); color: #3b2a05; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }

.stage { position: relative; margin-top: 14px; }
.bars { height: 260px; display: flex; align-items: flex-end; gap: 4px; padding: 0 2px; }
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; }
.col.split::before { content: ''; position: absolute; left: -3px; top: 0; bottom: -40px; border-left: 2px dashed var(--acc); opacity: .55; }
.bar { width: 100%; max-width: 54px; border-radius: 5px 5px 2px 2px; background: var(--bar); transition: height .18s ease, background .12s;
  position: relative; display: flex; align-items: flex-start; justify-content: center; }
.bar.out { opacity: .28; }
.bar.zone, .bar.lo { background: color-mix(in srgb, var(--acc) 38%, var(--bar)); }
.bar.hi { background: var(--hi); outline: 1.5px dashed var(--mute); outline-offset: -1.5px; }
.bar.eq { background: var(--eq); }
.bar.done { background: var(--acc); }
.bar.cmp { background: var(--cmp); }
.bar.wr { background: var(--wr); }
.bar.piv { box-shadow: inset 0 0 0 3px var(--ink); }
.val { font-size: 13px; font-weight: 700; margin-top: 5px; white-space: nowrap; line-height: 1.1; text-align: center; font-variant-numeric: tabular-nums; }
.val sub { font-size: 9px; font-weight: 600; color: var(--mute); margin-left: 1px; }
.val b { color: #fff; background: var(--acc); border-radius: 3px; padding: 0 2px; }
.idx { font-family: 'D2Coding', monospace; font-size: 10.5px; color: var(--mute); margin-top: 2px; }
.ptr { height: 18px; font-family: 'D2Coding', monospace; font-size: 11px; font-weight: 700; color: var(--acc); white-space: nowrap; line-height: 18px; }
.grp { width: 70%; height: 4px; border-radius: 2px; margin-top: 3px; }
.dense .val { font-size: 11px; }
.dense .val sub { display: none; }
.vdense .val { font-size: 9.5px; writing-mode: vertical-rl; transform: rotate(180deg); margin: 4px 0 0; }

/* extra panels */
.extra { margin-top: 12px; display: grid; gap: 10px; }
.extra:empty { display: none; }
.xbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.xt { font-size: 12px; font-weight: 700; color: var(--mute); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.xt .chip { font-size: 11.5px; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
.cellw { display: flex; flex-direction: column; align-items: center; }
.cell { min-width: 34px; height: 30px; padding: 0 5px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13.5px; background: var(--card); font-variant-numeric: tabular-nums; }
.cell sub { font-size: 9px; color: var(--mute); margin-left: 1px; }
.cell.empty { border-style: dashed; color: transparent; }
.cell.used { opacity: .35; }
.cell.cur { background: var(--accs); border-color: var(--acc); }
.cell.hl { background: var(--cmp); border-color: var(--cmp); color: #3b2a05; }
.cell.new { background: var(--wr); border-color: var(--wr); color: #fff; }
.cell.new sub { color: #fff; }
.cix { font-family: 'D2Coding', monospace; font-size: 10px; color: var(--mute); }
.lr { display: grid; grid-template-columns: 22px 1fr; gap: 6px 8px; align-items: center; }
.lr > span { font-family: 'D2Coding', monospace; font-weight: 700; color: var(--mute); }
.bk { display: grid; grid-template-columns: 46px 1fr; gap: 4px; align-items: center; padding: 2px 0; }
.bk .bn { font-family: 'D2Coding', monospace; font-size: 12px; color: var(--mute); }
.bk.on { background: var(--accs); border-radius: 6px; }
.nil { color: var(--mute); font-size: 12px; opacity: .6; }
svg.tree { width: 100%; max-height: 210px; }
svg.tree line { stroke: var(--line); stroke-width: 1.5; }
svg.tree circle { fill: var(--card); stroke: var(--mute); stroke-width: 1.4; }
svg.tree circle.done { fill: var(--acc); stroke: var(--acc); opacity: .35; }
svg.tree circle.cmp { fill: var(--cmp); stroke: var(--cmp); }
svg.tree circle.wr { fill: var(--wr); stroke: var(--wr); }
svg.tree text { font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; fill: var(--ink); }
svg.tree text.ix { font-size: 9px; font-weight: 500; fill: var(--mute); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 14px; height: 11px; border-radius: 3px; display: inline-block; background: var(--bar); }
.sw.cmp { background: var(--cmp); } .sw.wr { background: var(--wr); } .sw.done { background: var(--acc); }
.sw.zone { background: color-mix(in srgb, var(--acc) 38%, var(--bar)); } .sw.piv { background: var(--bar); box-shadow: inset 0 0 0 2.5px var(--ink); }
.sw.hi { background: var(--hi); outline: 1.5px dashed var(--mute); outline-offset: -1.5px; } .sw.eq { background: var(--eq); } .sw.out { opacity: .3; }
.counters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.ctr b { display: block; font-size: 18px; color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }

/* pseudocode */
.code { position: sticky; top: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 130px); }

.code-h b { font-weight: 700; }
.code-h span { font-family: 'D2Coding', monospace; font-size: 11.5px; color: var(--mute); }
.pseudo { background: var(--code-bg); padding: 12px 0; overflow: auto; font-family: 'D2Coding', monospace; font-size: 13px; line-height: 1.6; flex: 1; }
.ln { display: flex; white-space: pre; padding-right: 12px; border-left: 3px solid transparent; }
.ln.sp { height: .8em; }
.ln.on { background: var(--code-hl); border-left-color: var(--code-hl-bar); }
.g { width: 34px; flex: none; text-align: right; padding-right: 10px; color: var(--mute); opacity: .7; font-size: .85em; }
.ln.on .g { opacity: 1; color: var(--code-hl-bar); font-weight: 700; }
.kw { font-weight: 700; } .pn { color: var(--pn); font-weight: 700; } .as { color: var(--as); font-weight: 700; } .cm { color: var(--cm); }

/* player */
.player { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); z-index: 10; }
.player .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.pbtns { display: flex; gap: 6px; }
.pbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; }
.pbtn:hover { border-color: var(--acc); color: var(--acc); }
.pbtn.play { width: 52px; background: var(--acc); border-color: var(--acc); color: #fff; }
.pbtn svg { width: 18px; height: 18px; fill: currentColor; }
.slider { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; }
.slider input { flex: 1; accent-color: var(--acc); }
.slider .mono { font-size: 12px; color: var(--mute); white-space: nowrap; min-width: 82px; text-align: right; }
.speed { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mute); font-weight: 600; }
.speed input { width: 110px; accent-color: var(--acc); }
.hint { font-size: 11.5px; color: var(--mute); }

@media (max-width: 960px) {
  .grid { grid-template-columns: 1fr; }
  .code { position: static; max-height: 380px; }
}
@media (max-width: 600px) {
  body { font-size: 14px; padding-bottom: 140px; }

  select#algo { min-width: 0; width: 100%; }
  .lab { min-width: 0; width: 100%; }
  .bars { height: 200px; gap: 2px; }
  .viz { padding: 12px; }
  .controls { padding: 14px; }
  .speed input { width: 80px; }
  .hint { display: none; }
  .slider { order: 3; flex-basis: 100%; }
}

<body data-part="1">
<div class="wrap">
  <header class="top">
    <div>
      <h1>Sorting <span>Visualizer</span></h1>
      <p>CLRS 정렬 알고리즘 단계별 시각화 — 리스트를 입력하고 한 단계씩 따라가 보세요.</p>
    </div>
    <button class="theme-btn" id="theme" title="라이트/다크 전환">◐ 테마</button>
  </header>

  <section class="panel controls">
    <div class="row">
      <span class="lab">알고리즘</span>
      <select id="algo"></select>
      <div class="meta" id="meta"></div>
    </div>
    <div class="row">
      <span class="lab">입력</span>
      <input id="input" type="text" class="mono" placeholder="예: 5, 2, 4, 6, 1, 3" spellcheck="false" autocomplete="off">
      <button class="btn" id="exBtn" title="PDF 요약 노트와 같은 예시">CLRS 예시</button>

        <label class="opt" data-opt="depth">깊이 한도 <input id="depth" type="number" min="0" max="20" placeholder="자동"><small>(0~1로 두면 힙 정렬 전환을 볼 수 있음)</small></label>
        <label class="check"><input type="checkbox" id="dupTag" checked> 같은 값 구분 표시 <small style="color:var(--mute)">(안정성 확인용 a, b, c…)</small></label>

<script>
// ===================================================================
// 정렬 단계 기록 엔진 — PDF 요약 노트의 Python 코드와 같은 로직
// 각 run() 은 { steps, result } 를 돌려준다.
// step = { A, line:[proc, n|[n..]], desc, nc, nw, done[], cmp[], wr[],
//          piv, range, zone, ptr{}, key, ex{} }
// ===================================================================
const ENGINE = (() => {
  const fmt = v => {
    if (Number.isInteger(v)) return String(v);
    let s = String(+v.toFixed(3));
    if (s.startsWith('0.')) s = s.slice(1);
    return s;
  };

  class Rec {
    constructor(vals) {
      this.A = vals.map((v, i) => ({ v, id: i }));
      this.n = vals.length;
      this.steps = [];
      this.nc = 0; this.nw = 0;
      this.done = new Set();
      this.ctx = {};
    }
    snap(line, desc, o = {}) {
      const ex = Object.assign({}, this.ctx, o.ex || {});
      this.steps.push({
        A: this.A.slice(), line, desc, nc: this.nc, nw: this.nw, done: [...this.done],
        cmp: o.cmp || [], wr: o.wr || [], piv: o.piv ?? null, range: o.range || null,
        zone: o.zone || null, ptr: o.ptr || null, key: o.key || null,
        ex: Object.keys(ex).length ? JSON.parse(JSON.stringify(ex)) : null,
      });
      if (this.steps.length > 20000) throw new Error('단계가 너무 많습니다');
    }
    swap(i, j) {
      if (i === j) return;
      const t = this.A[i]; this.A[i] = this.A[j]; this.A[j] = t; this.nw += 2;
    }
    finish(desc = '정렬 완료') {
      for (let i = 0; i < this.n; i++) this.done.add(i);
      this.ctx = {};
      this.snap(null, desc);
      return { steps: this.steps, result: this.A.slice() };
    }
  }
  const P1 = i => i + 1; // 화면 표기는 1-based

  // ---------------------------------------------------------- 공용 부품
  // 구간 삽입 정렬 A[lo..hi]; L(n) → 의사코드 행
  function insertionRange(R, lo, hi, L, label = '') {
    const A = R.A;
    for (let i = lo + 1; i <= hi; i++) {
      const key = A[i];
      let j = i - 1;
      R.snap(L(2), `${label}key ← A[${P1(i)}] = ${fmt(key.v)}`, { range: [lo, hi], zone: [lo, i - 1], key, ptr: { i } });
      while (j >= lo) {
        R.nc++;
        if (A[j].v > key.v) {
          A[j + 1] = A[j]; R.nw++;
          R.snap(L([5, 6, 7]), `${label}A[${P1(j)}] = ${fmt(A[j].v)} > key → 오른쪽으로 한 칸`, { range: [lo, hi], zone: [lo, i], key, wr: [j + 1], cmp: [j], ptr: { j } });
          j--;
        } else {
          R.snap(L(5), `${label}A[${P1(j)}] = ${fmt(A[j].v)} ≤ key → 멈춤`, { range: [lo, hi], zone: [lo, i - 1], key, cmp: [j], ptr: { j } });
          break;
        }
      }
      A[j + 1] = key; R.nw++;
      R.snap(L(8), `${label}A[${P1(j + 1)}] ← key = ${fmt(key.v)}`, { range: [lo, hi], zone: [lo, i], wr: [j + 1] });
    }
  }

  // MERGE(A, p, q, r)
  function mergeG(R, p, q, r, L) {
    const A = R.A;
    const Ls = A.slice(p, q + 1), Rs = A.slice(q + 1, r + 1);
    const ex = (li, ri, took) => ({ L: Ls, R: Rs, li, ri, took });
    R.snap(L([1, 2, 3, 4, 5, 6, 7]), `A[${P1(p)}:${P1(q)}] → L, A[${P1(q + 1)}:${P1(r)}] → R 복사`, { range: [p, r], ex: ex(0, 0, null) });
    let i = 0, j = 0, k = p;
    while (i < Ls.length && j < Rs.length) {
      R.nc++;
      if (Ls[i].v <= Rs[j].v) {
        A[k] = Ls[i]; R.nw++;
        R.snap(L([11, 12, 13, 14, 17]), `L[${i}] = ${fmt(Ls[i].v)} ≤ R[${j}] = ${fmt(Rs[j].v)} → A[${P1(k)}] ← L[${i}]`, { range: [p, r], zone: [p, k], wr: [k], ex: ex(i, j, 'L') });
        i++;
      } else {
        A[k] = Rs[j]; R.nw++;
        R.snap(L([11, 12, 15, 16, 17]), `L[${i}] = ${fmt(Ls[i].v)} > R[${j}] = ${fmt(Rs[j].v)} → A[${P1(k)}] ← R[${j}]`, { range: [p, r], zone: [p, k], wr: [k], ex: ex(i, j, 'R') });
        j++;
      }
      k++;
    }
    while (i < Ls.length) {
      A[k] = Ls[i]; R.nw++;
      R.snap(L([18, 19, 20, 21]), `남은 L[${i}] = ${fmt(Ls[i].v)} → A[${P1(k)}]`, { range: [p, r], zone: [p, k], wr: [k], ex: ex(i, j, 'L') });
      i++; k++;
    }
    while (j < Rs.length) {
      A[k] = Rs[j]; R.nw++;
      R.snap(L([22, 23, 24, 25]), `남은 R[${j}] = ${fmt(Rs[j].v)} → A[${P1(k)}]`, { range: [p, r], zone: [p, k], wr: [k], ex: ex(i, j, 'R') });
      j++; k++;
    }
  }

  // PARTITION(A, p, r) — Lomuto
  function partitionG(R, p, r, L) {
    const A = R.A, x = A[r];
    const ex = (i, j) => ({ part: { p, i, j, r } });
    R.snap(L([1, 2]), `피벗 x = A[${P1(r)}] = ${fmt(x.v)}, i ← ${p}`, { range: [p, r], piv: r, ex: ex(p - 1, p) });
    let i = p - 1;
    for (let j = p; j < r; j++) {
      R.nc++;
      if (A[j].v <= x.v) {
        i++;
        const s = i !== j;
        R.swap(i, j);
        R.snap(L([3, 4, 5, 6]), `A[${P1(j)}] = ${fmt(A[i].v)} ≤ ${fmt(x.v)} → i = ${P1(i)}${s ? `, A[${P1(i)}] ↔ A[${P1(j)}]` : ''}`,
          { range: [p, r], piv: r, cmp: [j], wr: s ? [i, j] : [], ptr: { i, j }, ex: ex(i, j + 1) });
      } else {
        R.snap(L([3, 4]), `A[${P1(j)}] = ${fmt(A[j].v)} > ${fmt(x.v)} → 그대로`, { range: [p, r], piv: r, cmp: [j], ptr: { i: i >= p ? i : undefined, j }, ex: ex(i, j + 1) });
      }
    }
    R.swap(i + 1, r);
    R.done.add(i + 1);
    R.snap(L([7, 8]), `피벗을 A[${P1(i + 1)}]로 → q = ${P1(i + 1)} (최종 위치 확정)`, { range: [p, r], wr: i + 1 !== r ? [i + 1, r] : [], ex: ex(i, r + 1) });
    return i + 1;
  }

  // 힙 정렬 A[base .. base+len-1]; Lp(proc, n) → 행
  function heapG(R, base, len, Lp, label = '') {
    const A = R.A;
    let hs = len;
    const at = i => base + i;
    const setCtx = () => { R.ctx.heap = { base, hs, len }; };
    function mh(i) {
      setCtx();
      const l = 2 * i + 1, r = 2 * i + 2;
      let largest = i;
      R.snap(Lp('MAX-HEAPIFY', [1, 2]), `${label}MAX-HEAPIFY(A, ${i + 1}): 자식 ${l + 1}, ${r + 1}`, { ptr: { i: at(i) }, range: [base, base + hs - 1] });
      if (l < hs) {
        R.nc++;
        if (A[at(l)].v > A[at(i)].v) largest = l;
        R.snap(Lp('MAX-HEAPIFY', [3, 4, 5]), `${label}A[${l + 1}] = ${fmt(A[at(l)].v)} vs A[${i + 1}] = ${fmt(A[at(i)].v)} → largest = ${largest + 1}`, { cmp: [at(l), at(i)], range: [base, base + hs - 1] });
      }
      if (r < hs) {
        R.nc++;
        const old = largest;
        if (A[at(r)].v > A[at(largest)].v) largest = r;
        R.snap(Lp('MAX-HEAPIFY', [6, 7]), `${label}A[${r + 1}] = ${fmt(A[at(r)].v)} vs A[${old + 1}] = ${fmt(A[at(old)].v)} → largest = ${largest + 1}`, { cmp: [at(r), at(old)], range: [base, base + hs - 1] });
      }
      if (largest !== i) {
        R.swap(at(i), at(largest));
        R.snap(Lp('MAX-HEAPIFY', [8, 9, 10]), `${label}A[${i + 1}] ↔ A[${largest + 1}], 아래로 계속`, { wr: [at(i), at(largest)], range: [base, base + hs - 1] });
        mh(largest);
      } else {
        R.snap(Lp('MAX-HEAPIFY', 8), `${label}largest = i → 힙 성질 만족`, { ptr: { i: at(i) }, range: [base, base + hs - 1] });
      }
    }
    setCtx();
    R.snap(Lp('BUILD-MAX-HEAP', 1), `${label}BUILD-MAX-HEAP: heap-size ← ${len}`, { range: [base, base + len - 1] });
    for (let i = Math.floor(len / 2) - 1; i >= 0; i--) {
      R.snap(Lp('BUILD-MAX-HEAP', [2, 3]), `${label}i = ${i + 1}`, { ptr: { i: at(i) }, range: [base, base + len - 1] });
      mh(i);
    }
    R.snap(Lp('HEAPSORT', 1), `${label}최대 힙 완성: 루트 A[1] = ${fmt(A[base].v)}이 최댓값`, { range: [base, base + len - 1] });
    for (let i = len - 1; i >= 1; i--) {
      R.swap(base, at(i));
      R.done.add(at(i));
      hs--; setCtx();
      R.snap(Lp('HEAPSORT', [2, 3, 4]), `${label}A[1] ↔ A[${i + 1}], heap-size = ${hs}`, { wr: [base, at(i)], range: [base, base + hs - 1] });
      mh(0);
    }
    R.done.add(base);
    delete R.ctx.heap;
  }

  // ---------------------------------------------------------- 알고리즘
  function insertion(vals) {
    const R = new Rec(vals), P = 'INSERTION-SORT';
    R.snap([P, 0], `시작: A[1]은 원소 하나라 이미 정렬된 상태`, { zone: [0, 0] });
    insertionRange(R, 0, R.n - 1, n => [P, n === 2 ? [1, 2] : n === 8 ? 8 : n === 5 ? 5 : [5, 6, 7]]);
    return R.finish();
  }

  function merge(vals) {
    const R = new Rec(vals);
    const L = n => ['MERGE', n];
    function ms(p, r) {
      R.snap(['MERGE-SORT', 0], `MERGE-SORT(A, ${P1(p)}, ${P1(r)})`, { range: [p, r] });
      if (p >= r) {
        R.snap(['MERGE-SORT', [1, 2]], `원소 ${r - p + 1}개 → 그대로 반환`, { range: [p, r] });
        return;
      }
      const q = Math.floor((p + r) / 2);
      R.snap(['MERGE-SORT', [1, 3]], `q = ${P1(q)}: A[${P1(p)}:${P1(q)}] | A[${P1(q + 1)}:${P1(r)}]로 분할`, { range: [p, r], ex: { split: q } });
      R.snap(['MERGE-SORT', 4], `왼쪽 절반 A[${P1(p)}:${P1(q)}] 정렬`, { range: [p, q] });
      ms(p, q);
      R.snap(['MERGE-SORT', 5], `오른쪽 절반 A[${P1(q + 1)}:${P1(r)}] 정렬`, { range: [q + 1, r] });
      ms(q + 1, r);
      R.snap(['MERGE-SORT', 6], `두 절반을 병합`, { range: [p, r], ex: { split: q } });
      mergeG(R, p, q, r, L);
    }
    if (R.n) ms(0, R.n - 1);
    return R.finish();
  }

  function heap(vals) {
    const R = new Rec(vals);
    if (R.n) heapG(R, 0, R.n, (proc, n) => [proc, n]);
    return R.finish();
  }

  function quick(vals) {
    const R = new Rec(vals);
    const L = n => ['PARTITION', n];
    function qs(p, r) {
      R.snap(['QUICKSORT', 0], `QUICKSORT(A, ${P1(p)}, ${P1(r)})`, { range: p <= r ? [p, r] : null });
      if (p < r) {
        R.snap(['QUICKSORT', [1, 2]], `p < r → 분할`, { range: [p, r] });
        const q = partitionG(R, p, r, L);
        R.snap(['QUICKSORT', 3], `왼쪽 A[${P1(p)}:${P1(q - 1)}] 재귀`, { range: q - 1 >= p ? [p, q - 1] : null });
        qs(p, q - 1);
        R.snap(['QUICKSORT', 4], `오른쪽 A[${P1(q + 1)}:${P1(r)}] 재귀`, { range: r >= q + 1 ? [q + 1, r] : null });
        qs(q + 1, r);
      } else {
        if (p === r) R.done.add(p);
        R.snap(['QUICKSORT', 1], p === r ? `원소 1개 → 확정` : `빈 구간`, { range: p === r ? [p, r] : null });
      }
    }
    if (R.n) qs(0, R.n - 1);
    return R.finish();
  }

  function rquick(vals, opts = {}) {
    const R = new Rec(vals);
    const rnd = opts.rng || Math.random;
    const L = n => ['PARTITION', n];
    function qs(p, r) {
      R.snap(['RANDOMIZED-QUICKSORT', 0], `RANDOMIZED-QUICKSORT(A, ${P1(p)}, ${P1(r)})`, { range: p <= r ? [p, r] : null });
      if (p < r) {
        const i = p + Math.floor(rnd() * (r - p + 1));
        R.snap(['RANDOMIZED-PARTITION', 1], `RANDOM(${P1(p)}, ${P1(r)}) = ${P1(i)} → 피벗 후보 ${fmt(R.A[i].v)}`, { range: [p, r], piv: i });
        R.swap(r, i);
        R.snap(['RANDOMIZED-PARTITION', 2], `A[${P1(r)}] ↔ A[${P1(i)}]`, { range: [p, r], piv: r, wr: i !== r ? [i, r] : [] });
        const q = partitionG(R, p, r, L);
        R.snap(['RANDOMIZED-QUICKSORT', 3], `왼쪽 재귀`, { range: q - 1 >= p ? [p, q - 1] : null });
        qs(p, q - 1);
        R.snap(['RANDOMIZED-QUICKSORT', 4], `오른쪽 재귀`, { range: r >= q + 1 ? [q + 1, r] : null });
        qs(q + 1, r);
      } else {
        if (p === r) R.done.add(p);
        R.snap(['RANDOMIZED-QUICKSORT', 1], p === r ? `원소 1개 → 확정` : `빈 구간`, { range: p === r ? [p, r] : null });
      }
    }
    if (R.n) qs(0, R.n - 1);
    return R.finish();
  }

  function counting(vals) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'COUNTING-SORT';
    const k = n ? Math.max(...vals) : 0;
    const C = new Array(k + 1).fill(0), B = new Array(n).fill(null);
    R.ctx = { C, B, k };
    R.snap([P, [1, 2, 3]], `k = ${k}: B[1:${n}], C[0:${k}] 생성, C ← 0`);
    for (let j = 0; j < n; j++) {
      C[A[j].v]++;
      R.snap([P, [4, 5]], `A[${P1(j)}] = ${A[j].v} → C[${A[j].v}] = ${C[A[j].v]}`, { cmp: [j], ex: { hiC: A[j].v } });
    }
    for (let i = 1; i <= k; i++) {
      C[i] += C[i - 1];
      R.snap([P, [7, 8]], `C[${i}] ← C[${i}] + C[${i - 1}] = ${C[i]}  (${i} 이하인 원소 수)`, { ex: { hiC: i } });
    }
    for (let j = n - 1; j >= 0; j--) {
      const v = A[j].v, pos = C[v];
      B[pos - 1] = A[j]; R.nw++;
      C[v]--;
      R.snap([P, [11, 12, 13]], `A[${P1(j)}] = ${v} → B[${pos}], C[${v}] = ${C[v]}`, { cmp: [j], ex: { hiC: v, hiB: pos - 1 } });
    }
    for (let i = 0; i < n; i++) A[i] = B[i];
    R.ctx = { B };
    R.snap([P, 14], `B를 결과로 반환 (같은 값의 원래 순서 유지 = 안정)`);
    return R.finish();
  }

  function radix(vals) {
    const R = new Rec(vals), n = R.n;
    const mx = n ? Math.max(...vals) : 0;
    let d = Math.max(1, String(mx).length);
    let e = 1;
    const dg = (x, e) => Math.floor(x / e) % 10;
    const names = ['일', '십', '백', '천', '만', '십만', '백만'];
    R.snap(['RADIX-SORT', 1], `최댓값 ${mx} → 자릿수 d = ${d}, e ← 1`);
    for (let pass = 0; pass < d; pass++) {
      const P = 'COUNTING-SORT-BY-DIGIT';
      const C = new Array(10).fill(0), B = new Array(n).fill(null);
      R.ctx = { C, B, exp: e, digitName: names[pass] || `${pass + 1}번째` };
      R.snap(['RADIX-SORT', [2, 3]], `${names[pass] || pass + 1}의 자리 기준 안정 정렬 (e = ${e})`);
      const A = R.A;
      for (let j = 0; j < n; j++) {
        const x = dg(A[j].v, e); C[x]++;
        R.snap([P, [4, 5, 6]], `A[${P1(j)}] = ${A[j].v}의 자릿값 ${x} → C[${x}] = ${C[x]}`, { cmp: [j], ex: { hiC: x } });
      }
      for (let i = 1; i < 10; i++) C[i] += C[i - 1];
      R.snap([P, [7, 8]], `C 누적합: C[i] = 자릿값이 i 이하인 원소 수`);
      for (let j = n - 1; j >= 0; j--) {
        const x = dg(A[j].v, e), pos = C[x];
        B[pos - 1] = A[j]; R.nw++; C[x]--;
        R.snap([P, [9, 10, 11, 12]], `A[${P1(j)}] = ${A[j].v} (자릿값 ${x}) → B[${pos}]`, { cmp: [j], ex: { hiC: x, hiB: pos - 1 } });
      }
      for (let i = 0; i < n; i++) A[i] = B[i];
      e *= 10;
      R.ctx = { exp: e / 10, digitName: names[pass] };
      R.snap(['RADIX-SORT', [3, 4]], `${names[pass] || pass + 1}의 자리 정렬 완료 → A ← B`);
    }
    R.ctx = {};
    return R.finish();
  }

  function bucket(vals) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'BUCKET-SORT';
    const B = Array.from({ length: n }, () => []);
    R.ctx = { buckets: B };
    R.snap([P, [1, 2, 3]], `빈 버킷 B[0] ~ B[${n - 1}] 생성 (각 버킷 폭 1/${n})`);
    for (let i = 0; i < n; i++) {
      const b = Math.floor(n * A[i].v);
      B[b].push(A[i]);
      R.snap([P, [4, 5]], `A[${P1(i)}] = ${fmt(A[i].v)} → 버킷 ⌊${n} · ${fmt(A[i].v)}⌋ = ${b}`, { cmp: [i], ex: { hiBucket: b } });
    }
    for (let b = 0; b < n; b++) {
      if (B[b].length < 2) continue;
      const before = B[b].map(x => fmt(x.v)).join(', ');
      const L = B[b];
      for (let i = 1; i < L.length; i++) {
        const key = L[i]; let j = i - 1;
        while (j >= 0) { R.nc++; if (L[j].v > key.v) { L[j + 1] = L[j]; j--; } else break; }
        L[j + 1] = key;
      }
      R.snap([P, [6, 7]], `버킷 ${b} 삽입 정렬: ${before} → ${L.map(x => fmt(x.v)).join(', ')}`, { ex: { hiBucket: b } });
    }
    let k = 0;
    for (let b = 0; b < n; b++) {
      for (const x of B[b]) {
        A[k] = x; R.nw++; R.done.add(k);
        R.snap([P, [8, 9]], `버킷 ${b}의 ${fmt(x.v)} → A[${P1(k)}]`, { wr: [k], ex: { hiBucket: b } });
        k++;
      }
    }
    return R.finish();
  }

  function selection(vals) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'SELECTION-SORT';
    for (let i = 0; i < n - 1; i++) {
      let s = i;
      R.snap([P, [1, 2]], `i = ${P1(i)}, smallest ← ${P1(i)}`, { ptr: { i, s }, range: [i, n - 1] });
      for (let j = i + 1; j < n; j++) {
        R.nc++;
        const old = s;
        if (A[j].v < A[s].v) s = j;
        R.snap([P, s !== old ? [3, 4, 5] : [3, 4]], `A[${P1(j)}] = ${fmt(A[j].v)} vs 최솟값 A[${P1(old)}] = ${fmt(A[old].v)}${s !== old ? ' → smallest 갱신' : ''}`,
          { cmp: [j, old], ptr: { i, j, s }, range: [i, n - 1] });
      }
      R.swap(i, s); R.done.add(i);
      R.snap([P, 6], s !== i ? `A[${P1(i)}] ↔ A[${P1(s)}]: 최솟값 ${fmt(A[i].v)} 확정` : `최솟값이 이미 제자리: ${fmt(A[i].v)} 확정`, { wr: s !== i ? [i, s] : [] });
    }
    return R.finish();
  }

  function bubble(vals) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'BUBBLESORT';
    for (let i = 0; i < n - 1; i++) {
      R.snap([P, 1], `i = ${P1(i)}: 뒤에서부터 최솟값을 A[${P1(i)}]로 띄워 올림`, { range: [i, n - 1] });
      for (let j = n - 1; j > i; j--) {
        R.nc++;
        if (A[j].v < A[j - 1].v) {
          R.swap(j, j - 1);
          R.snap([P, [2, 3, 4]], `A[${P1(j)}] < A[${P1(j - 1)}] → 교환`, { wr: [j, j - 1], ptr: { j }, range: [i, n - 1] });
        } else {
          R.snap([P, [2, 3]], `A[${P1(j)}] = ${fmt(A[j].v)} ≥ A[${P1(j - 1)}] = ${fmt(A[j - 1].v)} → 그대로`, { cmp: [j, j - 1], ptr: { j }, range: [i, n - 1] });
        }
      }
      R.done.add(i);
      R.snap([P, 1], `A[${P1(i)}] = ${fmt(A[i].v)} 확정`);
    }
    return R.finish();
  }

  function shell(vals) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'SHELL-SORT';
    const gaps = []; let h = 1;
    while (h < n) { gaps.push(h); h = 3 * h + 1; }
    gaps.reverse();
    R.snap(['KNUTH-GAPS', [1, 2, 3, 4, 5, 6]], `Knuth 간격 수열 H = ⟨${gaps.join(', ')}⟩`);
    for (const h of gaps) {
      R.ctx = { h };
      R.snap([P, 1], `h = ${h}: 간격 ${h}인 부분 수열 ${h}개를 각각 삽입 정렬`);
      for (let i = h; i < n; i++) {
        const key = A[i]; let j = i - h;
        R.snap([P, [2, 3, 4]], `i = ${P1(i)}, key = ${fmt(key.v)}`, { key, ptr: { i } });
        while (j >= 0) {
          R.nc++;
          if (A[j].v > key.v) {
            A[j + h] = A[j]; R.nw++;
            R.snap([P, [5, 6, 7]], `A[${P1(j)}] = ${fmt(A[j].v)} > key → ${h}칸 오른쪽으로`, { key, cmp: [j], wr: [j + h], ptr: { j } });
            j -= h;
          } else {
            R.snap([P, 5], `A[${P1(j)}] = ${fmt(A[j].v)} ≤ key → 멈춤`, { key, cmp: [j], ptr: { j } });
            break;
          }
        }
        A[j + h] = key; R.nw++;
        R.snap([P, 8], `A[${P1(j + h)}] ← key = ${fmt(key.v)}`, { wr: [j + h] });
      }
    }
    return R.finish();
  }

  function tim(vals, opts = {}) {
    const R = new Rec(vals), A = R.A, n = R.n, P = 'TIM-SORT';
    const minrun = Math.max(2, opts.minrun || 4);
    const runs = [];
    R.ctx = { runs };
    R.snap([P, [1, 2]], `minrun = ${minrun}, lo ← 1`);
    let lo = 0;
    while (lo < n) {
      let hi = lo;
      R.snap([P, [3, 4]], `lo = ${P1(lo)}에서 새 run 탐지`, { ptr: { lo } });
      let desc = false;
      if (hi + 1 < n) { R.nc++; desc = A[hi + 1].v < A[hi].v; }
      if (desc) {
        while (hi + 1 < n) { if (hi + 1 > lo + 1) R.nc++; if (A[hi + 1].v < A[hi].v) hi++; else break; }
        R.snap([P, [5, 6, 7]], `A[${P1(lo)}:${P1(hi)}]는 순감소 run`, { range: [lo, hi], ptr: { lo, hi } });
        for (let a = lo, b = hi; a < b; a++, b--) R.swap(a, b);
        R.snap([P, 8], `순감소 run 뒤집기 → 비감소`, { range: [lo, hi], wr: Array.from({ length: hi - lo + 1 }, (_, t) => lo + t) });
      } else {
        while (hi + 1 < n) { if (hi > lo) R.nc++; if (A[hi + 1].v >= A[hi].v) hi++; else break; }
        R.snap([P, [9, 10]], `A[${P1(lo)}:${P1(hi)}]는 비감소 run (길이 ${hi - lo + 1})`, { range: [lo, hi], ptr: { lo, hi } });
      }
      const end = Math.min(Math.max(hi, lo + minrun - 1), n - 1);
      if (end > hi) {
        R.snap([P, 11], `길이 ${hi - lo + 1} < minrun → A[${P1(end)}]까지 확장해 삽입 정렬`, { range: [lo, end] });
        // 이미 정렬된 앞부분은 건너뛰고 hi+1부터 삽입
        for (let i = hi + 1; i <= end; i++) {
          const key = A[i]; let j = i - 1;
          R.snap([P, 12], `key ← A[${P1(i)}] = ${fmt(key.v)}`, { range: [lo, end], zone: [lo, i - 1], key, ptr: { i } });
          while (j >= lo) {
            R.nc++;
            if (A[j].v > key.v) {
              A[j + 1] = A[j]; R.nw++;
              R.snap([P, 12], `A[${P1(j)}] = ${fmt(A[j].v)} > key → 오른쪽으로`, { range: [lo, end], zone: [lo, i], key, wr: [j + 1], cmp: [j] });
              j--;
            } else break;
          }
          A[j + 1] = key; R.nw++;
          R.snap([P, 12], `A[${P1(j + 1)}] ← key`, { range: [lo, end], zone: [lo, i], wr: [j + 1] });
        }
      }
      runs.push([lo, end]);
      R.snap([P, [13, 14]], `run (${P1(lo)}, ${P1(end)}) 추가 → 현재 run ${runs.length}개`, { range: [lo, end] });
      lo = end + 1;
    }
    while (runs.length > 1) {
      R.snap([P, 15], `run ${runs.length}개 → 인접한 쌍끼리 병합`);
      const merged = [];
      for (let k = 0; k + 1 < runs.length; k += 2) {

        let code = line, c = '';
        if (line.includes('//')) { const k = line.indexOf('//'); code = line.slice(0, k); c = `<span class="cm">// ${esc(line.slice(k + 2).trim())}</span>`; }
        out.push(`<div class="ln" data-p="${name}" data-n="${cont ? -1 : num}"><span class="g">${cont ? '' : num}</span><span>${hl(code)}${c}</span></div>`);
      });
    });
    $('pseudo').innerHTML = out.join('');
  }

  // ---------- 입력 처리
  function parse(text) {
    const toks = text.split(/[\s,]+/).filter(Boolean);
    const vals = toks.map(Number);
    const bad = toks.filter((t, i) => !Number.isFinite(vals[i]));
    return { vals, bad };
  }
  function showMsg(html, kind = 'err', actions = []) {
    const m = $('msg');
    m.className = `msg show ${kind}`;
    m.innerHTML = `<span>${html}</span>`;
    actions.forEach(([label, fn]) => {
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.onclick = fn; m.appendChild(b);
    });
  }
  const hideMsg = () => { $('msg').className = 'msg'; };
  function validate(a, vals, bad) {
    if (bad.length) return { err: `숫자가 아닌 값이 있어요: <b>${esc(bad.slice(0, 3).join(', '))}</b>` };
    if (vals.length < 2) return { err: '원소를 2개 이상 입력해 주세요.' };
    if (vals.length > 30) return { err: `원소가 ${vals.length}개예요. 시각화를 위해 30개 이하로 입력해 주세요.` };
    if (a.validate) {
      const e = a.validate(vals);
      if (e) {
        const res = { err: `${a.name}: ${e}` };
        if (a.id === 'bucket' && vals.every(v => v >= 0)) {
          const mx = Math.max(...vals);
          res.fix = ['0~1 범위로 바꾸기', () => { $('input').value = vals.map(v => +(v / (mx + 1)).toFixed(3)).map(fmt).map(s => s.startsWith('.') ? '0' + s : s).join(', '); build(false); }];
        }
        if ((a.id === 'counting' || a.id === 'radix') && vals.some(v => v < 0) && vals.every(Number.isInteger)) {
          const mn = Math.min(...vals);
          res.fix = [`모든 값에 ${-mn} 더하기`, () => { $('input').value = vals.map(v => v - mn).join(', '); build(false); }];
        }
        return res;
      }
    }
    return {};
  }

  // ---------- 빌드 & 재생
  function curAlgo() { return ALGOS.find(a => a.id === sel.value); }
  function build(autoplay) {
    stop();
    const a = curAlgo();
    const { vals, bad } = parse($('input').value);
    const v = validate(a, vals, bad);
    if (v.err) {
      showMsg(v.err, 'err', v.fix ? [v.fix] : []);
      st.steps = []; st.idx = 0; renderEmpty(vals.filter(Number.isFinite)); return;
    }
    hideMsg();
    st.vals = vals;
    st.min = Math.min(...vals); st.max = Math.max(...vals);
    // 같은 값 태그 (원래 순서대로 a, b, c…)
    const cnt = {}, seen = {};
    vals.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
    st.tags = {};
    vals.forEach((x, i) => { if (cnt[x] > 1) { seen[x] = (seen[x] || 0); st.tags[i] = String.fromCharCode(97 + seen[x]++); } });
    const opts = { minrun: +$('minrun').value || 4, threshold: +$('threshold').value || 4, depth: $('depth').value };
    try {
      st.steps = a.run(vals.slice(), opts).steps;
    } catch (e) { showMsg(e.message); return; }
    const last = st.steps[st.steps.length - 1];
    last.desc = `정렬 완료 — 비교 ${last.nc}번, 쓰기·교환 ${last.nw}번`;
    st.steps.unshift({ A: vals.map((v, i) => ({ v, id: i })), line: null, desc: '입력 상태 — ▶ 재생 또는 → 키로 한 단계씩 진행', nc: 0, nw: 0, done: [], cmp: [], wr: [], piv: null, range: null, zone: null, ptr: null, key: null, ex: null });
    $('seek').max = st.steps.length - 1;
    go(0);
    if (autoplay) play();
  }
  function go(i) {
    st.idx = Math.max(0, Math.min(st.steps.length - 1, i));
    render(st.steps[st.idx]);
    $('seek').value = st.idx;
    const lab = `${st.idx} / ${st.steps.length - 1}`;
    $('seekLab').textContent = lab; $('cStep').textContent = lab;
  }
  function play() {
    if (!st.steps.length) return;
    if (st.idx >= st.steps.length - 1) go(0);
    st.playing = true; setIcon();
    const tick = () => {
      if (!st.playing) return;
      if (st.idx >= st.steps.length - 1) { stop(); return; }
      go(st.idx + 1);
      st.timer = setTimeout(tick, SPEEDS[$('speed').value - 1]);
    };
    st.timer = setTimeout(tick, Math.min(250, SPEEDS[$('speed').value - 1]));
  }
  function stop() { st.playing = false; clearTimeout(st.timer); setIcon(); }
  function setIcon() {
    $('playIcon').innerHTML = st.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  }

  // ---------- 렌더링
  function label(x) {
    const t = $('dupTag').checked && st.tags[x.id] ? `<sub>${st.tags[x.id]}</sub>` : '';
    return `${fmt(x.v)}${t}`;
  }
  function radixLabel(x, exp) {
    const s = String(x.v), digits = String(st.max).length;
    const pos = s.length - 1 - Math.round(Math.log10(exp));
    const t = $('dupTag').checked && st.tags[x.id] ? `<sub>${st.tags[x.id]}</sub>` : '';
    if (pos < 0) return `<b>0</b>${s}${t}`;
    return s.split('').map((c, k) => k === pos ? `<b>${c}</b>` : c).join('') + t;
  }
  const GROUP = ['#3457d5', '#0b8a72', '#d18a16', '#b7327c', '#6b5bd6', '#2b9ad1', '#c2552f', '#4f8a1f', '#9b4dca', '#d4467a', '#3b7f8f', '#8a6d1f', '#5c6b80'];

  function renderEmpty(vals) {
    $('bars').innerHTML = ''; $('extra').innerHTML = '';
    $('desc').textContent = vals.length ? '입력을 확인해 주세요.' : '정렬 시작을 누르세요.';
    $('keybox').innerHTML = ''; $('stepno').textContent = '';
    ['cCmp', 'cWr'].forEach(k => $(k).textContent = '0');
    $('cN').textContent = vals.length; $('cStep').textContent = '0 / 0'; $('seekLab').textContent = '0 / 0'; $('seek').max = 0;
    document.querySelectorAll('.ln.on').forEach(e => e.classList.remove('on'));
  }

  function render(s) {
    const n = s.A.length;
    const ex = s.ex || {};
    const done = new Set(s.done), cmp = new Set(s.cmp), wr = new Set(s.wr);
    const span = (st.max - st.min) || 1;
    const bars = $('bars');
    bars.className = 'bars' + (n > 22 ? ' vdense' : n > 14 ? ' dense' : '');
    const ptrAt = {};
    if (s.ptr) for (const [k, v] of Object.entries(s.ptr)) if (v != null && v >= 0 && v < n) (ptrAt[v] = ptrAt[v] || []).push(k === 's' ? 'min' : k);
    let html = '';
    for (let i = 0; i < n; i++) {
      const x = s.A[i];
      const h = 10 + 90 * (x.v - st.min) / span;
      const c = ['bar'];
      if (s.range && (i < s.range[0] || i > s.range[1])) c.push('out');
      if (ex.part) { const { p, i: pi, j, r } = ex.part; if (i >= p && i <= pi) c.push('lo'); else if (i > pi && i < j && i < r) c.push('hi'); }
      if (ex.q3) { const q = ex.q3; if (i >= q.lo && i < q.lt) c.push('lo'); else if (i >= q.lt && i < q.i) c.push('eq'); else if (i > q.gt && i <= q.hi) c.push('hi'); }
      if (s.zone && i >= s.zone[0] && i <= s.zone[1]) c.push('zone');
      if (ex.heap && i >= ex.heap.base + ex.heap.hs && i < ex.heap.base + ex.heap.len) c.push('done');
      if (done.has(i)) c.push('done');
      if (cmp.has(i)) c.push('cmp');
      if (wr.has(i)) c.push('wr');
      if (s.piv === i) c.push('piv');
      const split = ex.split != null && i === ex.split + 1 ? ' split' : '';
      const lab = ex.exp ? radixLabel(x, ex.exp) : label(x);
      const grp = ex.h > 1 ? `<div class="grp" style="background:${GROUP[i % ex.h % GROUP.length]}"></div>` : '';
      html += `<div class="col${split}"><div class="${c.join(' ')}" style="height:${h.toFixed(1)}%"></div>`
        + `<div class="val">${lab}</div><div class="idx">${i + 1}</div>${grp}<div class="ptr">${(ptrAt[i] || []).join(',')}</div></div>`;
    }
    bars.innerHTML = html;
    $('desc').innerHTML = esc(s.desc).replace(/→/g, '<span style="color:var(--acc)">→</span>');
    $('keybox').innerHTML = s.key ? `<span class="keybox">key = ${label(s.key)}</span>` : '';
    $('stepno').textContent = s.line ? `${s.line[0]} ${[].concat(s.line[1]).filter(k => k > 0).join(',')}` : '';
    $('cCmp').textContent = s.nc; $('cWr').textContent = s.nw; $('cN').textContent = n;
    renderExtra(s, ex);
    highlightLine(s.line);
  }

  function cellsRow(arr, o = {}) {
    return '<div class="cells">' + arr.map((x, k) => {
      const c = ['cell'];
      if (x == null) c.push('empty');
      if (o.used && o.used(k)) c.push('used');
      if (o.cur === k) c.push('cur');
      if (o.hl === k) c.push('hl');
      if (o.nw === k) c.push('new');
      const txt = x == null ? '·' : (typeof x === 'object' ? label(x) : fmt(x));
      return `<div class="cellw"><div class="${c.join(' ')}">${txt}</div>${o.ix ? `<span class="cix">${o.ix(k)}</span>` : ''}</div>`;
    }).join('') + '</div>';
  }

  function renderExtra(s, ex) {
    const out = [];
    const chips = [];
    if (ex.h) chips.push(`<span class="chip acc">간격 h = <b>${ex.h}</b></span>`);
    if (ex.mode) chips.push(`<span class="chip acc">모드: <b>${ex.mode}</b></span><span class="chip">남은 깊이 <b>${ex.depth}</b></span>`);
    if (ex.digitName) chips.push(`<span class="chip acc"><b>${ex.digitName}의 자리</b> 기준</span>`);
    if (ex.runs && ex.runs.length) chips.push(...ex.runs.map((r, k) => `<span class="chip">run ${k + 1}: A[${r[0] + 1}:${r[1] + 1}]</span>`));
    if (ex.q3) chips.push(`<span class="chip">lt = ${ex.q3.lt + 1}</span><span class="chip">i = ${ex.q3.i + 1}</span><span class="chip">gt = ${ex.q3.gt + 1}</span>`);
    if (ex.part) chips.push(`<span class="chip">i = ${ex.part.i + 1}</span><span class="chip">j = ${Math.min(ex.part.j, ex.part.r) + 1}</span>`);
    if (chips.length) out.push(`<div class="xt" style="margin:0">${chips.join('')}</div>`);
    if (ex.L) {
      out.push(`<div class="xbox"><div class="xt">보조 배열 (MERGE) — 흐린 칸은 이미 A로 복사됨</div><div class="lr">`
        + `<span>L</span>${cellsRow(ex.L, { used: k => k < ex.li, nw: ex.took === 'L' ? ex.li : undefined, cur: ex.took ? undefined : ex.li, ix: k => k })}`
        + `<span>R</span>${cellsRow(ex.R, { used: k => k < ex.ri, nw: ex.took === 'R' ? ex.ri : undefined, cur: ex.took ? undefined : ex.ri, ix: k => k })}`
        + `</div></div>`);
    }
    if (ex.heap) out.push(`<div class="xbox"><div class="xt">힙 구조 <span class="chip">heap-size = ${ex.heap.hs}</span></div>${treeSvg(s, ex.heap)}</div>`);
    if (ex.C) {
      out.push(`<div class="xbox"><div class="xt">카운트 배열 C</div>${cellsRow(ex.C, { hl: ex.hiC, ix: k => k })}</div>`);
    }
    if (ex.B) {
      out.push(`<div class="xbox"><div class="xt">출력 배열 B</div>${cellsRow(ex.B, { nw: ex.hiB, ix: k => k + 1 })}</div>`);
    }
    if (ex.buckets) {
      const rows = ex.buckets.map((b, k) => `<div class="bk${ex.hiBucket === k ? ' on' : ''}"><span class="bn">B[${k}]</span>`
        + (b.length ? cellsRow(b) : '<span class="nil">—</span>') + '</div>').join('');
      out.push(`<div class="xbox"><div class="xt">버킷 (각 [i/n, (i+1)/n) 구간)</div>${rows}</div>`);
    }
    $('extra').innerHTML = out.join('');
  }

  function treeSvg(s, hp) {
    const { base, hs, len } = hp;
    const W = 520, levels = Math.floor(Math.log2(len)) + 1, H = 26 + levels * 48;
    const pos = [];
    for (let i = 0; i < len; i++) {
      const d = Math.floor(Math.log2(i + 1)), k = i + 1 - 2 ** d, cnt = 2 ** d;
      pos.push([W * (k + .5) / cnt, 22 + d * 48]);
    }
    const cmp = new Set(s.cmp), wr = new Set(s.wr);
    let g = '';
    for (let i = 1; i < len; i++) { const p = (i - 1) >> 1; g += `<line x1="${pos[p][0]}" y1="${pos[p][1]}" x2="${pos[i][0]}" y2="${pos[i][1]}" ${i >= hs ? 'stroke-dasharray="3 3"' : ''}/>`; }
    for (let i = 0; i < len; i++) {
      const a = base + i;
      const c = wr.has(a) ? 'wr' : cmp.has(a) ? 'cmp' : i >= hs ? 'done' : '';
      const r = len > 15 ? 12 : 15;
      g += `<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="${r}" class="${c}"/><text x="${pos[i][0]}" y="${pos[i][1] + 4}">${fmt(s.A[a].v)}</text>`
        + `<text class="ix" x="${pos[i][0] + r + 5}" y="${pos[i][1] - r + 2}">${i + 1}</text>`;
    }
    return `<svg class="tree" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  }

  function highlightLine(line) {
    const box = $('pseudo');
    box.querySelectorAll('.ln.on').forEach(e => e.classList.remove('on'));
    if (!line) return;
    const [p, ns] = line;
    const want = [].concat(ns);
    let first = null;
    box.querySelectorAll(`.ln[data-p="${p}"]`).forEach(e => {
      const k = +e.dataset.n;
      if (want.includes(k) || (k === -1 && e.previousElementSibling && e.previousElementSibling.classList.contains('on'))) {
        e.classList.add('on'); if (!first) first = e;
      }
    });
    if (first) {
      const top = first.offsetTop - box.offsetTop, bottom = top + first.offsetHeight;
      if (top < box.scrollTop + 10 || bottom > box.scrollTop + box.clientHeight - 30)
        box.scrollTo({ top: Math.max(0, top - box.clientHeight / 3), behavior: 'smooth' });
    }
  }

  // ---------- 알고리즘 변경
  function legendFor(a) {
    const items = [['cmp', '비교·읽기'], ['wr', '쓰기·교환'], ['done', '위치 확정']];
    if (['insertion', 'merge', 'shell', 'tim', 'intro'].includes(a.id)) items.push(['zone', '정렬된 부분']);
    if (['quick', 'rquick', 'intro'].includes(a.id)) items.push(['piv', '피벗'], ['zone', '≤ 피벗'], ['hi', '> 피벗']);
    if (a.id === 'quick3') items.push(['zone', '< pivot'], ['eq', '= pivot'], ['hi', '> pivot']);
    items.push(['out', '현재 구간 밖']);
    $('legend').innerHTML = items.map(([c, t]) => `<span><span class="sw ${c}"></span>${t}</span>`).join('');
  }
  function onAlgo(loadExample) {
    const a = curAlgo();
    document.body.dataset.part = a.part;
    const cx = a.cx;
    $('meta').innerHTML = (a.src ? `<span class="chip acc">${a.src}</span>` : '<span class="chip out">CLRS 미포함</span>')
      + `<span class="chip${a.stable ? '' : ' no'}">안정</span><span class="chip${a.inplace ? '' : ' no'}">제자리</span>`
      + `<span class="chip">최선 <b>${cx[0]}</b></span><span class="chip">평균 <b>${cx[1]}</b></span><span class="chip">최악 <b>${cx[2]}</b></span>`;
    document.querySelectorAll('[data-opt]').forEach(el => el.style.display = (a.opts || []).includes(el.dataset.opt) ? '' : 'none');
    $('codeTitle').textContent = a.src ? 'CLRS 의사코드' : 'CLRS 스타일 의사코드';
    renderPseudo(PSEUDO[a.pseudo || a.id]);
    const foot = {
      radix: 'CLRS 원문 RADIX-SORT는 “각 자리를 안정 정렬로 정렬”하는 두 줄이며, 여기서는 계수 정렬로 구체화했습니다.',
      tim: '원리를 보여주는 단순화 버전입니다. 실제 TimSort의 run 스택 불변식·galloping은 PDF 참고.',
      intro: '분할은 Lomuto PARTITION, 작은 구간은 삽입 정렬, 깊이 0이면 힙 정렬을 씁니다.',
      bucket: '입력은 [0, 1) 구간의 실수여야 합니다.',
      counting: '입력은 0 이상의 정수여야 합니다. k = 최댓값.',
      rquick: '재생할 때마다 피벗이 무작위로 바뀝니다.',
    }[a.id] || (a.src ? `출처: ${a.src}` : 'CLRS 본문에는 없는 알고리즘입니다.');
    $('codeFoot').textContent = foot;
    legendFor(a);
    if (loadExample) $('input').value = a.ex.map(fmt).map(s => s.startsWith('.') ? '0' + s : s).join(', ');
    build(false);
  }

  function randomInput() {
    const a = curAlgo();
    const n = Math.max(2, Math.min(30, +$('count').value || 10));
    $('count').value = n;
    const r = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    let vals;
    if (a.id === 'bucket') vals = Array.from({ length: n }, () => (r(1, 99) / 100));
    else if (a.id === 'radix') vals = Array.from({ length: n }, () => r(1, 999));
    else if (a.id === 'counting') vals = Array.from({ length: n }, () => r(0, Math.max(5, Math.floor(n * .8))));
    else if (a.id === 'quick3') vals = Array.from({ length: n }, () => r(1, Math.max(3, Math.floor(n / 3))));
    else vals = Array.from({ length: n }, () => r(1, Math.max(20, n * 2)));
    $('input').value = vals.map(v => a.id === 'bucket' ? v.toFixed(2) : v).join(', ');
    build(false);
  }

  // ---------- 이벤트
  sel.addEventListener('change', () => {
    const a = curAlgo();
    const { vals, bad } = parse($('input').value);
    onAlgo(!!validate(a, vals, bad).err);
  });
  $('exBtn').onclick = () => onAlgo(true);
  $('rndBtn').onclick = randomInput;
  $('runBtn').onclick = () => build(true);
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter') build(true); });
  ['minrun', 'threshold', 'depth'].forEach(id => $(id).addEventListener('change', () => build(false)));
  $('dupTag').addEventListener('change', () => st.steps.length && render(st.steps[st.idx]));
  $('bFirst').onclick = () => { stop(); go(0); };
  $('bLast').onclick = () => { stop(); go(st.steps.length - 1); };
  $('bPrev').onclick = () => { stop(); go(st.idx - 1); };
  $('bNext').onclick = () => { stop(); go(st.idx + 1); };
  $('bPlay').onclick = () => st.playing ? stop() : play();
  $('seek').addEventListener('input', e => { stop(); go(+e.target.value); });
  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) && e.target.type !== 'range') return;
    if (tag === 'BUTTON' && [' ', 'ArrowLeft', 'ArrowRight'].includes(e.key)) document.activeElement.blur();
    if (e.key === ' ') { e.preventDefault(); st.playing ? stop() : play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(st.idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(st.idx - 1); }
    else if (e.key === 'Home') { stop(); go(0); }
    else if (e.key === 'End') { stop(); go(st.steps.length - 1); }
  });
  $('theme').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  };

  onAlgo(true);
})();
</script>
</body>
</html>
